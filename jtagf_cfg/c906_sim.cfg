# Standalone config. Do not also load the old c910_sim.cfg.
debug_level 2
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 4445
transport select jtag
jtag newtap riscv cpu -irlen 16 -expected-id 0x080d2b43
# Keep IR capture checking enabled. The observed capture mismatch needs
# separate investigation in the model/bridge; do not silently mask it here.
target create c910.core0 c910_had -tap riscv.cpu -coreid 0 -endian little -gdb-port disabled
# Enable only if core 1 exists in this model:
# target create c910.core1 c910_had -tap riscv.cpu -coreid 1 -endian little -gdb-port disabled
init
# Simulated scans are slow. Use explicit poll while bringing up the driver.
poll off
targets c910.core0
